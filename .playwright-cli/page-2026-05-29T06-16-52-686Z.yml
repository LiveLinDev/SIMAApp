  - generic [ref=e61]:
    - heading "Ventajas y desventajas reales por formato" [level=2] [ref=e62]
    - paragraph [ref=e63]: Basadas en los resultados del benchmark con este dataset específico. No son afirmaciones genéricas — son consecuencias directas de cómo cada formato representa los mismos datos.
    - generic [ref=e64]:
      - generic [ref=e65]:
        - generic [ref=e66]: MINI
        - paragraph [ref=e67]: ✓ Ventajas
        - list [ref=e68]:
          - listitem [ref=e69]: Menor conteo de tokens del grupo
          - listitem [ref=e70]: Sin delimitadores redundantes (llaves, corchetes, etiquetas)
          - listitem [ref=e71]:
            - text: La respuesta correcta va inline con
            - code [ref=e72]: "*"
            - text: ", no en campo separado"
          - listitem [ref=e73]: Ideal para contextos de LLM con límite de tokens
        - paragraph [ref=e74]: ✗ Desventajas
        - list [ref=e75]:
          - listitem [ref=e76]: Requiere parser propio — no hay librerías estándar
          - listitem [ref=e77]:
            - text: Frágil ante caracteres
            - code [ref=e78]: "|"
            - text: o
            - code [ref=e79]: ","
            - text: en el contenido
          - listitem [ref=e80]: Sin validación de esquema nativa
          - listitem [ref=e81]: Difícil de leer sin herramientas
      - generic [ref=e82]:
        - generic [ref=e83]: JSON
        - paragraph [ref=e84]: ✓ Ventajas
        - list [ref=e85]:
          - listitem [ref=e86]: Soporte nativo en todos los lenguajes
          - listitem [ref=e87]: Fácil de validar con JSON Schema
          - listitem [ref=e88]: Legible y predecible
          - listitem [ref=e89]: Estándar de facto para APIs
        - paragraph [ref=e90]: ✗ Desventajas
        - list [ref=e91]:
          - listitem [ref=e92]: Mayor conteo de tokens del grupo
          - listitem [ref=e93]: Mucha repetición de claves en arrays de objetos
          - listitem [ref=e94]: Comillas y llaves añaden overhead significativo
      - generic [ref=e95]:
        - generic [ref=e96]: YAML
        - paragraph [ref=e97]: ✓ Ventajas
        - list [ref=e98]:
          - listitem [ref=e99]: Más legible que JSON para humanos
          - listitem [ref=e100]: Sin comillas en la mayoría de valores
          - listitem [ref=e101]: Soporte amplio en herramientas DevOps
        - paragraph [ref=e102]: ✗ Desventajas
        - list [ref=e103]:
          - listitem [ref=e104]: La indentación añade tokens extra
          - listitem [ref=e105]: Más tokens que JSON en datasets con muchos campos anidados
          - listitem [ref=e106]: Sensible a errores de indentación
          - listitem [ref=e107]:
            - text: Comportamiento sorpresivo con tipos (ej.
            - code [ref=e108]: "true"
            - text: ", fechas)"
      - generic [ref=e109]:
        - generic [ref=e110]: XML
        - paragraph [ref=e111]: ✓ Ventajas
        - list [ref=e112]:
          - listitem [ref=e113]: Atributos permiten comprimir datos en una sola etiqueta
          - listitem [ref=e114]: Validación con XSD/DTD
          - listitem [ref=e115]: Estándar maduro con amplio tooling
        - paragraph [ref=e116]: ✗ Desventajas
        - list [ref=e117]:
          - listitem [ref=e118]: Etiquetas de apertura y cierre duplican el nombre del campo
          - listitem [ref=e119]: Segundo formato más costoso en tokens
          - listitem [ref=e120]: Verboso para datos tabulares
      - generic [ref=e121]:
        - generic [ref=e122]: TOON
        - paragraph [ref=e123]: ✓ Ventajas
        - list [ref=e124]:
          - listitem [ref=e125]: Más compacto que JSON y XML
          - listitem [ref=e126]: Estructura visual clara con indentación mínima
        - paragraph [ref=e127]: ✗ Desventajas
        - list [ref=e128]:
          - listitem [ref=e129]: Formato no estándar — sin ecosistema
          - listitem [ref=e130]: Menos eficiente que MINI para datos planos
          - listitem [ref=e131]: Adopción prácticamente nula
