  - banner [ref=e4]:
    - paragraph [ref=e5]: Metodología y fuentes
    - heading "Benchmark de eficiencia de tokens" [level=1] [ref=e6]
    - paragraph [ref=e7]: Cómo se midió, qué datos se usaron y qué revelan los resultados reales de cada formato.
  - generic [ref=e8]:
    - heading "Metodología de conteo" [level=2] [ref=e9]
    - paragraph [ref=e10]:
      - text: El benchmark mide la cantidad de tokens que consume cada formato al representar exactamente los mismos datos psicométricos. El conteo se hace con el tokenizador
      - code [ref=e11]: cl100k_base
      - text: de OpenAI (usado por GPT-4 y GPT-4o), que es el estándar de facto para evaluar eficiencia en contextos de LLM.
    - heading "Algoritmo paso a paso" [level=3] [ref=e12]
    - list [ref=e13]:
      - listitem [ref=e14]: Se toma un cuestionario de referencia con 12 ítems de opción múltiple, parámetros IRT (a, b, c) y metadatos CAT completos.
      - listitem [ref=e15]: "El mismo cuestionario se serializa en cada formato: JSON, MINI, TOON, YAML y XML, sin omitir ningún campo."
      - listitem [ref=e16]:
        - text: Cada representación se pasa por
        - code [ref=e17]: tiktoken
        - text: con el encoding
        - code [ref=e18]: cl100k_base
        - text: para obtener el conteo exacto de tokens.
      - listitem [ref=e19]:
        - text: "Se calcula el ratio de reducción de cada formato respecto a JSON (la línea base), usando la fórmula:"
        - code [ref=e20]: ratio = (json_tokens - format_tokens) / json_tokens × 100
        - text: .
      - listitem [ref=e21]:
        - text: Los resultados se grafican en el componente embebido de abajo, que ejecuta el mismo cálculo en el navegador usando la librería
        - code [ref=e22]: Chart.js 4.4.1
        - text: .
    - heading "Herramientas usadas" [level=3] [ref=e23]
    - list [ref=e24]:
      - listitem [ref=e25]:
        - code [ref=e26]: tiktoken
        - text: — tokenizador oficial de OpenAI (
        - link "github.com/openai/tiktoken" [ref=e27] [cursor=pointer]:
          - /url: https://github.com/openai/tiktoken
        - text: )
      - listitem [ref=e28]:
        - code [ref=e29]: cl100k_base
        - text: — encoding de GPT-4 / GPT-4o / text-embedding-3
      - listitem [ref=e30]:
        - code [ref=e31]: Chart.js 4.4.1
        - text: — visualización en el navegador
