  - generic [ref=e60]:
    - generic [ref=e61]: El problema
    - generic [ref=e62]: Por qué nació .mini
    - generic [ref=e63]:
      - generic [ref=e64]:
        - paragraph [ref=e65]: "SIMA convierte contenido educativo real en evaluaciones adaptativas. Para hacerlo bien, la IA no necesitaba decorar datos: necesitaba un recipiente mínimo, estable y barato de generar."
        - generic [ref=e66]:
          - paragraph [ref=e67]: "\"Queríamos la claridad de JSON sin su peso. Queríamos que la IA extrajera lo importante de una clase y lo entregara en un formato que pudiera vivir en producción, no solo en una demo.\""
          - generic [ref=e68]: — Adrián Palma & Erick Palomino, creadores de .mini
      - generic [ref=e69]:
        - generic [ref=e70]:
          - img [ref=e72]
          - generic [ref=e74]:
            - heading "JSON es demasiado verboso" [level=4] [ref=e75]
            - paragraph [ref=e76]: Cada campo repite su nombre en cada registro. Para 45 preguntas con 4 opciones, el costo en tokens se vuelve prohibitivo en producción.
        - generic [ref=e77]:
          - img [ref=e79]
          - generic [ref=e81]:
            - heading ".toon falla en contenido largo" [level=4] [ref=e82]
            - paragraph [ref=e83]: En transcripciones extensas, .toon exige más estructura de la que la IA mantiene de forma consistente. .mini reduce la superficie de error.
        - generic [ref=e84]:
          - img [ref=e86]
          - generic [ref=e89]:
            - heading ".mini resuelve ambos problemas" [level=4] [ref=e90]
            - paragraph [ref=e91]: Una línea de cabecera + N líneas de ítems. Lo bastante humano para auditarlo. Lo bastante pequeño para producirlo miles de veces.
