# SIMA — sitio Nginx (proxy a gunicorn en 127.0.0.1:8000).
#
# Instalar:
#   sudo cp deploy/nginx/sima.conf /etc/nginx/sites-available/sima
#   sudo sed -i 's/DOMINIO/sima.midominio.pe/g' /etc/nginx/sites-available/sima
#   sudo ln -sf /etc/nginx/sites-available/sima /etc/nginx/sites-enabled/sima
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: este archivo escucha solo en el puerto 80. `sudo certbot --nginx -d DOMINIO`
# agrega el bloque 443 con el certificado y la redireccion de HTTP a HTTPS.
# Modo demo solo-IP: pon la IP del VPS en lugar de DOMINIO (sin certbot).

upstream sima_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # Audios de clase: hasta 200 MB por subida (Django no impone otro limite al archivo).
    client_max_body_size 200M;
    client_body_timeout 300s;

    access_log /var/log/nginx/sima.access.log;
    error_log  /var/log/nginx/sima.error.log;

    # Compresion de texto (HTML, CSS, JS, JSON, SVG)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    # Archivos estaticos generados por `manage.py collectstatic` (STATIC_ROOT)
    location /static/ {
        alias /srv/sima/app/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # MEDIA_ROOT: guarda audios subidos por usuarios (se borran tras transcribir).
    # Son datos privados y ninguna pagina enlaza /media/, por eso NO es publico:
    # `internal` solo permite servirlo si Django lo autoriza con X-Accel-Redirect.
    location /media/ {
        alias /srv/sima/app/media/;
        internal;
    }

    # No exponer archivos ocultos (.env, .git, etc.) si alguien cambia los alias
    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://sima_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django (BEHIND_PROXY=1) usa esta cabecera para saber si la peticion fue HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;

        # Algunas vistas llaman a la IA de forma sincrona: igual o mayor que --timeout de gunicorn
        proxy_connect_timeout 10s;
        proxy_send_timeout    310s;
        proxy_read_timeout    310s;
        # Las subidas grandes se reciben completas en Nginx antes de pasar a gunicorn
        proxy_request_buffering on;
    }
}
