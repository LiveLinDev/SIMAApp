RAW.mini = RAW.mini
  .replace(/(SH)(i1\|)/, '$1\n$2')
  .replace(/(low|medium|high)(i\d+\|)/g, '$1\n$2');

function tokenize(text) {
  const chunks = [];
  const re = /\s+|[^\s\w]|[\w\u00C0-\u024F\u0300-\u036F]+/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const t = m[0];
    if (/\s+/.test(t)) { chunks.push(t); continue; }
    for (let i = 0; i < t.length; i += 4) chunks.push(t.slice(i, i + 4));
  }
  return chunks.filter(c => c.length > 0);
}

function analyze(key) {
  const text = RAW[key];
  const chars = text.length;
  const tokens = tokenize(text).length;
  const lines = text.split('\n').length;
  const structChars = key === 'json'
    ? (text.match(/[{}\[\]:,"]/g)||[]).length
    : key === 'xml'
    ? (text.match(/[<>\/="]/g)||[]).length
    : key === 'yaml'
    ? (text.match(/[-:]/g)||[]).length
    : key === 'toon'
    ? (text.match(/[\[\]{}:,\-"]/g)||[]).length
    : (text.match(/[|*,]/g)||[]).length;
  const contentChars = chars - structChars;
  const overhead = ((structChars / chars) * 100);
  return { chars, tokens, lines, structChars, contentChars, overhead: overhead.toFixed(1) };
}

const formats = ['json','mini','toon','yaml','xml'];
const labels = { json:'JSON', mini:'MINI', toon:'TOON', yaml:'YAML', xml:'XML' };
const colors  = { json:'#378ADD', mini:'#1D9E75', toon:'#60A5FA', yaml:'#BA7517', xml:'#D4537E' };
const stats = {};
formats.forEach(f => { stats[f] = analyze(f); });

const maxTokens = Math.max(...formats.map(f => stats[f].tokens));
const cards = document.getElementById('metric-cards');
formats.forEach(f => {
  const s = stats[f];
  const pct = Math.round((s.tokens / maxTokens) * 100);
  const isMin = s.tokens === Math.min(...formats.map(x => stats[x].tokens));
  cards.innerHTML += `<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;border:${isMin?'2px solid #1D9E75':'0.5px solid var(--color-border-tertiary)'}">
    <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:500;color:${colors[f]}">${labels[f]}</span>
      ${isMin?'<span style="font-size:10px;background:#E1F5EE;color:#0F6E56;padding:2px 6px;border-radius:4px">más eficiente</span>':''}
    </div>
    <div style="font-size:22px;font-weight:500;color:var(--color-text-primary)">${s.tokens.toLocaleString()}</div>
    <div style="font-size:11px;color:var(--color-text-secondary)">tokens estimados</div>
    <div style="margin-top:8px;background:var(--color-border-tertiary);border-radius:4px;height:4px">
      <div style="width:${pct}%;height:4px;border-radius:4px;background:${colors[f]}"></div>
    </div>
    <div style="font-size:11px;color:var(--color-text-secondary);margin-top:4px">${s.chars.toLocaleString()} chars · overhead ${s.overhead}%</div>
  </div>`;
});

const tabs = ['tokens','chars','overhead','lines'];
const tabLabels = { tokens:'Tokens', chars:'Caracteres', overhead:'% Overhead', lines:'Líneas' };
let activeTab = 'tokens';
const tabBar = document.getElementById('tab-bar');
tabs.forEach(t => {
  const btn = document.createElement('button');
  btn.textContent = tabLabels[t];
  btn.dataset.tab = t;
  btn.style.cssText = `padding:6px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:${t===activeTab?'var(--color-background-secondary)':'transparent'};color:var(--color-text-primary);cursor:pointer;font-size:13px`;
  btn.onclick = () => switchTab(t);
  tabBar.appendChild(btn);
});

let chartInst = null;
function getDataFor(tab) {
  return formats.map(f => {
    if (tab === 'tokens') return stats[f].tokens;
    if (tab === 'chars') return stats[f].chars;
    if (tab === 'overhead') return parseFloat(stats[f].overhead);
    if (tab === 'lines') return stats[f].lines;
  });
}

function buildChart(tab) {
  const chartArea = document.getElementById('chart-area');
  if (!window.Chart) {
    chartArea.innerHTML = '<div style="height:100%;display:grid;place-items:center;border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);color:var(--color-text-secondary);font-size:13px">Grafico no disponible sin Chart.js; el desglose queda debajo.</div>';
    return;
  }
  if (chartInst) { chartInst.destroy(); }
  const ctx = document.getElementById('mainChart');
  chartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: formats.map(f => labels[f]),
      datasets: [{
        label: tabLabels[tab],
        data: getDataFor(tab),
        backgroundColor: formats.map(f => colors[f] + 'CC'),
        borderColor: formats.map(f => colors[f]),
        borderWidth: 1.5,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { color: '#888', font: { size: 11 } },
          grid: { color: 'rgba(128,128,128,0.1)' }
        },
        x: {
          ticks: { color: '#888', font: { size: 13, weight: '500' } },
          grid: { display: false }
        }
      }
    }
  });
}

function switchTab(tab) {
  activeTab = tab;
  tabBar.querySelectorAll('button').forEach(b => {
    b.style.background = b.dataset.tab === tab ? 'var(--color-background-secondary)' : 'transparent';
  });
  buildChart(tab);
  buildBreakdown();
}

function buildBreakdown() {
  const area = document.getElementById('breakdown-area');
  const minFmt = formats.reduce((a,b) => stats[a].tokens < stats[b].tokens ? a : b);
  area.innerHTML = `<div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:10px;font-weight:500">Desglose comparativo</div>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">
    <thead>
      <tr style="border-bottom:0.5px solid var(--color-border-tertiary)">
        <th style="text-align:left;padding:6px 8px;color:var(--color-text-secondary);font-weight:500">Formato</th>
        <th style="text-align:right;padding:6px 8px;color:var(--color-text-secondary);font-weight:500">Tokens</th>
        <th style="text-align:right;padding:6px 8px;color:var(--color-text-secondary);font-weight:500">Chars</th>
        <th style="text-align:right;padding:6px 8px;color:var(--color-text-secondary);font-weight:500">Overhead</th>
        <th style="text-align:right;padding:6px 8px;color:var(--color-text-secondary);font-weight:500">vs MINI</th>
        <th style="text-align:right;padding:6px 8px;color:var(--color-text-secondary);font-weight:500">Líneas</th>
      </tr>
    </thead>
    <tbody>
      ${formats.map(f => {
        const s = stats[f];
        const ratio = ((stats[f].tokens / stats[minFmt].tokens - 1)*100).toFixed(1);
        const isMin = f === minFmt;
        return `<tr style="border-bottom:0.5px solid var(--color-border-tertiary)">
          <td style="padding:7px 8px"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:${colors[f]};flex-shrink:0"></span><span style="font-weight:500">${labels[f]}</span></span></td>
          <td style="text-align:right;padding:7px 8px;font-weight:500">${s.tokens.toLocaleString()}</td>
          <td style="text-align:right;padding:7px 8px">${s.chars.toLocaleString()}</td>
          <td style="text-align:right;padding:7px 8px">${s.overhead}%</td>
          <td style="text-align:right;padding:7px 8px;color:${isMin?'#1D9E75':'#D85A30'}">${isMin?'baseline':'+'+ratio+'%'}</td>
          <td style="text-align:right;padding:7px 8px">${s.lines}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}

const minFmt = formats.reduce((a,b) => stats[a].tokens < stats[b].tokens ? a : b);
const maxFmt = formats.reduce((a,b) => stats[a].tokens > stats[b].tokens ? a : b);
const saving = Math.round((1 - stats[minFmt].tokens / stats[maxFmt].tokens)*100);

document.getElementById('verdict-box').innerHTML = `
  <div style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px">Veredicto del benchmark</div>
  <div style="font-size:13px;color:var(--color-text-secondary);line-height:1.7">
    <strong style="color:#1D9E75">MINI</strong> es el formato más eficiente: <strong>${stats.mini.tokens.toLocaleString()} tokens</strong> frente a 
    <strong>${stats.json.tokens.toLocaleString()}</strong> de JSON, <strong>${stats.toon.tokens.toLocaleString()}</strong> de TOON, <strong>${stats.yaml.tokens.toLocaleString()}</strong> de YAML y <strong>${stats.xml.tokens.toLocaleString()}</strong> de XML.
    Ahorra un <strong style="color:#1D9E75">${saving}%</strong> respecto al formato más costoso (${labels[maxFmt]}).
    Su overhead estructural es de solo <strong>${stats.mini.overhead}%</strong> — los delimitadores <code>|</code>, <code>,</code> y <code>*</code> son mínimos comparados con las etiquetas repetidas de XML o las claves verbosas de JSON.
  </div>`;

buildChart('tokens');
buildBreakdown();
</script>
