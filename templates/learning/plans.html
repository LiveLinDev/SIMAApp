{% extends "base.html" %}
{% load learning_extras %}
{% block title %}Planes - SIMA{% endblock %}
{% block content %}
<section class="page-head">
  <p class="eyebrow">Elige ritmo</p>
  <h1>Planes mensuales</h1>
</section>
<form method="post">
  {% csrf_token %}
  <div class="plan-grid">
    {% for value, label in form.plan.field.choices %}
      {% with plan=plans|get_item:value %}
      <label class="plan-card selectable">
        <input type="radio" name="plan" value="{{ value }}" {% if form.plan.value == value %}checked{% endif %}>
        <span class="plan-badge">{{ plan.label }}</span>
        <h2>${{ plan.price }}<small>/mes</small></h2>
        {% if plan.description %}
          <p>{{ plan.description }}</p>
        {% endif %}
        {% if plan.credits == None %}
          <p>Creditos ilimitados.</p>
        {% else %}
          <p>{{ plan.credits }} creditos mensuales.</p>
        {% endif %}
        {% if plan.classes == None %}
          <p>Clases API ilimitadas.</p>
        {% else %}
          <p>{{ plan.classes }} clases API al mes.</p>
        {% endif %}
      </label>
      {% endwith %}
    {% endfor %}
  </div>
  <button class="primary-button full" type="submit">Guardar plan</button>
</form>
{% endblock %}
